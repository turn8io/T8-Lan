# Bouwcontrole op een schone machine, met de ongetekende installer als artifact om na te
# kijken. Dit is NIET de release: die wordt lokaal gebouwd en ondertekend
# (scripts/release-signed.ps1) en met gh op de release gezet. Deze workflow raakt de
# GitHub-release daarom nooit aan; een eerdere versie overschreef bij een tag-push het
# getekende asset met de ongetekende build (26-10-2026).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build release bundle
        run: npm run release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: t8-lan-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
