[package]
name = "t8-lan"
version = "0.2.0"
description = "Snel schakelen tussen statisch IP en DHCP op Windows. Door Turn8."
authors = ["Turn8 <info@turn8.io>"]
edition = "2021"
rust-version = "1.80"
# Proprietair, source-available — zie ../LICENSE (geen open source).
license = "LicenseRef-Turn8-Proprietary"
publish = false

[lib]
name = "t8_lan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [
    "tray-icon",
    "image-ico",
    "wry",
    "custom-protocol",
] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UDP multicast (Hikvision SADP discovery): nette bind met SO_REUSEADDR + interface-keuze.
# Zit al transitief in de tree, dus geen extra binary-gewicht.
socket2 = "0.6"

tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
incremental = false

[profile.dev]
incremental = true
